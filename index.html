<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBACH JMMT - Galería</title>
  <link rel="icon" type="image/png" href="imgs/favicon.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="principal.css">
  <script src="principal.js"></script>

  <style>
    /* ==========================================
       LAYOUT DE COLUMNAS FLEXBOX (MASONRY)
       ========================================== */
    .masonry-grid {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem;
      align-items: flex-start;
    }

    .masonry-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* ==========================================
       ELEMENTOS DE LA GALERÍA Y ANIMACIONES
       ========================================== */
    .masonry-item {
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .masonry-item.mostrar {
      opacity: 1;
      transform: translateY(0);
    }

    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Esqueleto placeholder adaptativo */
    .masonry-item.esqueleto {
      min-height: 250px;
      background-color: rgba(var(--bs-secondary-rgb), 0.15);
      position: relative;
    }
  </style>
</head>

<body>
  <h-cargando></h-cargando>
  <h-menu></h-menu>

  <main>
    <div class="masonry-grid" id="collage-container"></div>
  </main>

  <footer></footer>

  <script>
    // CONFIGURACIÓN DE LA GALERÍA
    const config = {
      jsonUrl: 'galeria.json',
      loteInicial: 15,      // Carga inicial para pintar la UI velozmente
      loteSubsecuente: 6    // Lotes de carga por scroll
    };

    // ESTADO DE LA APLICACIÓN (Encapsulado para control de flujo)
    const appState = {
      imagenes: [],
      indiceActual: 0,
      cargando: false,
      columnasDOM: [],
      indiceColumnaActual: 0
    };

    const contenedor = document.getElementById('collage-container');
    let observadorScroll = null;

    // 1. GENERACIÓN DINÁMICA DE COLUMNAS RESPONSIVAS
    function prepararColumnas() {
      contenedor.innerHTML = '';
      appState.columnasDOM = [];

      // Breakpoint de Bootstrap: >= 768px son 3 columnas, móvil son 2
      const numColumnas = window.innerWidth >= 768 ? 3 : 2;
      const fragmento = document.createDocumentFragment();

      for (let i = 0; i < numColumnas; i++) {
        const col = document.createElement('div');
        col.className = 'masonry-column';
        fragmento.appendChild(col);
        appState.columnasDOM.push(col);
      }
      contenedor.appendChild(fragmento);
    }

    // 2. ORDENAMIENTO NATURAL DE RUTAS ALFANUMÉRICAS (1.2.jpg -> 1.10.jpg)
    function ordenarRutasNatural(rutas) {
      const colator = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });
      return rutas.sort((a, b) => colator.compare(a, b));
    }

    // 3. LAZY LOAD DE IMÁGENES (Ahorro de ancho de banda)
    const observadorVisual = new IntersectionObserver((entradas) => {
      entradas.forEach(entrada => {
        if (entrada.isIntersecting) {
          const elemento = entrada.target;
          const img = elemento.querySelector('img');

          if (img?.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');

            img.onload = () => {
              elemento.classList.remove('esqueleto');
              requestAnimationFrame(() => elemento.classList.add('mostrar'));
            };

            img.onerror = () => {
              elemento.remove();
            };
          }
          observadorVisual.unobserve(elemento);
        }
      });
    }, { rootMargin: '0px 0px 300px 0px' });

    // 4. INYECCIÓN DEL PLACEHOLDER EN EL DOM
    function inyectarPlaceholder(ruta) {
      const elemento = document.createElement('div');
      elemento.className = 'masonry-item esqueleto';

      const nombreArchivo = ruta.split('/').pop().replace('.jpg', '');
      const img = document.createElement('img');
      img.alt = `Fotografía escolar ${nombreArchivo}`;
      img.dataset.src = ruta;

      elemento.appendChild(img);

      // Balanceo de distribución cíclica en columnas
      appState.columnasDOM[appState.indiceColumnaActual].appendChild(elemento);
      appState.indiceColumnaActual = (appState.indiceColumnaActual + 1) % appState.columnasDOM.length;

      observadorVisual.observe(elemento);
    }

    // 5. CONTROLADOR DE FLUJO ASÍNCRONO DE LOTES
    async function cargarLoteDeFotos(tamanoLote) {
      if (appState.cargando || appState.indiceActual >= appState.imagenes.length) return;

      appState.cargando = true;
      const limite = Math.min(appState.indiceActual + tamanoLote, appState.imagenes.length);
      const promesasImagenes = [];

      for (let i = appState.indiceActual; i < limite; i++) {
        const ruta = appState.imagenes[i];
        inyectarPlaceholder(ruta);

        const promesaPreload = new Promise((resolve) => {
          const imgPreload = new Image();
          imgPreload.src = ruta;
          imgPreload.onload = () => resolve();
          imgPreload.onerror = () => resolve();
        });
        promesasImagenes.push(promesaPreload);
      }

      appState.indiceActual = limite;

      // Espera reactiva para estabilizar el layout antes de liberar el semáforo
      await Promise.all(promesasImagenes);
      appState.cargando = false;
    }

    // 6. DETECTOR DE SCROLL INFINITO MEDIANTE CENTINELA
    function configurarScrollInfinito() {
      const centinelaPrevio = document.getElementById('galeria-centinela');
      if (centinelaPrevio) centinelaPrevio.remove();

      const centinela = document.createElement('div');
      centinela.id = 'galeria-centinela';
      centinela.className = 'w-100';
      centinela.style.height = '15px';
      contenedor.parentNode.insertBefore(centinela, contenedor.nextSibling);

      observadorScroll = new IntersectionObserver((entradas) => {
        if (entradas[0].isIntersecting && !appState.cargando && appState.indiceActual < appState.imagenes.length) {
          cargarLoteDeFotos(config.loteSubsecuente);
        }
      }, { rootMargin: '0px 0px 600px 0px' }); // Margen amplio para evitar cortes de scroll bruscos

      observadorScroll.observe(centinela);
    }

    // 7. ORQUESTRADOR DE INICIALIZACIÓN SECUENCIAL
    async function inicializarGaleria() {
      try {
        prepararColumnas();

        // Obtención de datos del manifiesto
        const respuesta = await fetch(config.jsonUrl);
        if (!respuesta.ok) throw new Error(`Error HTTP: ${respuesta.status}`);

        const datosRaw = await respuesta.json();
        appState.imagenes = ordenarRutasNatural(datosRaw);

        // Renderizado del lote inicial y bloqueo controlado
        await cargarLoteDeFotos(config.loteInicial);

        // Activación del escuchador físico de scroll
        configurarScrollInfinito();

        // VERIFICACIÓN DE SEGURIDAD PARA PANTALLAS DE ALTA RESOLUCIÓN (3 Columnas)
        // Si tras el lote inicial el centinela sigue dentro del viewport del cliente,
        // forzamos la inyección del siguiente lote de manera inmediata.
        setTimeout(() => {
          const centinela = document.getElementById('galeria-centinela');
          if (centinela) {
            const rect = centinela.getBoundingClientRect();
            const visibleEnPantalla = rect.top < (window.innerHeight || document.documentElement.clientHeight);

            if (visibleEnPantalla && !appState.cargando && appState.indiceActual < appState.imagenes.length) {
              cargarLoteDeFotos(config.loteSubsecuente);
            }
          }
        }, 350);

      } catch (e) {
        if (typeof msgError === 'function') {
          msgError("Error al inicializar galería", e);
        } else {
          console.error("Error al inicializar galería:", e);
        }
      }
    }

    // Inicialización del script respetando el ciclo de vida del DOM
    document.addEventListener('DOMContentLoaded', inicializarGaleria);
  </script>
</body>

</html>
