<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBACH JMMT</title>
  <link rel="icon" type="image/png" href="imgs/favicon.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="principal.css">
  <script src="principal.js"></script>

  <style>
    /* ==========================================
   LAYOUT MASONRY (Multi-column nativo)
   ========================================== */
    .masonry-grid {
      column-count: 2;
      /* 2 columnas en móviles por defecto */
      column-gap: 0.5rem;
      padding: 0.5rem;
    }

    /* ==========================================
   ELEMENTOS Y ANIMACIÓN BASE
   ========================================== */
    .masonry-item {
      break-inside: avoid;
      /* Evita que las fotos se partan entre columnas */
      margin-bottom: 0.5rem;
      display: inline-block;
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;
      /* Previene el colapso del Observer */

      /* Estado inicial oculto para la animación */
      opacity: 0;
      transform: translateY(30px);

      /* Transición acelerada por GPU con curva natural */
      transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        box-shadow 0.3s ease;
      cursor: pointer;
    }

    /* Estado final inyectado por JavaScript */
    .masonry-item.mostrar {
      opacity: 1;
      transform: translateY(0);
    }

    /* Efecto hover sobre elementos ya visibles */
    .masonry-item.mostrar:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
    }

    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ==========================================
   RESPONSIVIDAD (Mejora Escalonada)
   ========================================== */
    @media (min-width: 768px) {
      .masonry-grid {
        column-count: 3;
        /* 3 columnas en tablets/laptops pequeñas */
      }
    }

    @media (min-width: 1200px) {
      .masonry-grid {
        column-count: 4;
        /* 4 columnas en monitores anchos */
      }
    }
  </style>
</head>

<body>
  <div id="app-cargando"></div>

  <div id="app-content" style="padding-top: 50px;">
    <header></header>
    <main>
      <!-- Aquí se inyectarán las fotos del collage -->
      <div class="masonry-grid" id="collage-container"></div>

      <!-- Pantalla completa (Modal de Bootstrap) para ver la foto -->
      <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
          <div class="modal-content">
            <div class="modal-header">
              <button type="button" class="btn-close btn-close-n" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <img id="fullImage" src="" alt="Fotografía en pantalla completa">
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer></footer>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE LA GALERÍA
    // ==========================================
    const config = {
      carpeta: 'imgs/galeria/',
      extensiones: ['jpg', 'jpeg', 'png'],
      maxFallosPermitidos: 5 // Tolerancia a saltos numéricos (ej. si falta la foto 4)
    };

    // Referencias al DOM
    const contenedor = document.getElementById('collage-container');
    const imagenEnGrande = document.getElementById('fullImage');
    const modalOpciones = new bootstrap.Modal(document.getElementById('imageModal'));

    // Estado Global
    let idFotoActual = 1;
    let finDeDirectorio = false;
    let contadorFallos = 0;
    let cargando = false;

    // ==========================================
    // 1. CÁLCULO DINÁMICO DEL VIEWPORT
    // ==========================================
    function calcularLoteOptimo() {
      const alturaPantalla = window.innerHeight;
      const alturaEstimadaFoto = 200;
      const columnasActivas = window.innerWidth >= 1200 ? 4 : (window.innerWidth >= 768 ? 3 : 2);

      // Calcula cuántas fotos se necesitan para llenar la pantalla y generar scroll
      const filasQueCaben = Math.ceil(alturaPantalla / alturaEstimadaFoto);
      const loteBase = filasQueCaben * columnasActivas;

      return loteBase + columnasActivas;
    }

    // ==========================================
    // 2. CONFIGURACIÓN DEL OBSERVER (Infinite Scroll)
    // ==========================================
    const observadorScroll = new IntersectionObserver((entradas) => {
      if (entradas[0].isIntersecting && !finDeDirectorio && !cargando) {
        cargarLoteDeFotos();
      }
    }, { rootMargin: '0px 0px 300px 0px' });

    // Inyección del centinela invisible
    const centinela = document.createElement('div');
    centinela.style.width = '100%';
    centinela.style.height = '1px';
    contenedor.parentNode.insertBefore(centinela, contenedor.nextSibling);

    // ==========================================
    // 3. CONTROL DE FLUJO Y AUTO-SANACIÓN
    // ==========================================
    function cargarLoteDeFotos() {
      cargando = true;
      const fotosACargar = calcularLoteOptimo();

      for (let i = 0; i < fotosACargar; i++) {
        if (finDeDirectorio) break;
        procesarImagen(idFotoActual++);
      }

      // Failsafe: Evita la Trampa del Observador
      setTimeout(() => {
        cargando = false;
        const centinelaVisible = centinela.getBoundingClientRect().top < window.innerHeight;

        if (centinelaVisible && !finDeDirectorio) {
          cargarLoteDeFotos();
        }
      }, 350);
    }

    // ==========================================
    // 4. PROCESAMIENTO, ANIMACIÓN Y FALLBACKS
    // ==========================================
    function procesarImagen(id) {
      const elemento = document.createElement('div');
      elemento.className = 'masonry-item';
      elemento.tabIndex = 0; // A11y
      elemento.setAttribute('role', 'button');

      const img = document.createElement('img');
      img.alt = `Fotografía número ${id}`;
      img.loading = "lazy";

      let indiceExt = 0;

      // Lógica de Fallback de extensiones
      const intentarSiguienteExtension = () => {
        if (indiceExt < config.extensiones.length) {
          img.src = `${config.carpeta}${id}.${config.extensiones[indiceExt]}`;
          indiceExt++;
        } else {
          elemento.remove();
          contadorFallos++;

          if (contadorFallos >= config.maxFallosPermitidos) {
            finDeDirectorio = true;
          } else if (!finDeDirectorio) {
            procesarImagen(idFotoActual++);
          }
        }
      };

      img.addEventListener('error', intentarSiguienteExtension);

      img.addEventListener('load', () => {
        contadorFallos = 0; // Reset de errores

        // ANIMACIÓN: Aparece suavemente solo cuando ya está lista
        requestAnimationFrame(() => {
          elemento.classList.add('mostrar');
        });

        // Lógica del Modal
        const abrirModal = () => {
          imagenEnGrande.src = img.src;
          modalOpciones.show();
        };

        elemento.addEventListener('click', abrirModal);
        elemento.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            abrirModal();
          }
        });
      });

      intentarSiguienteExtension();
      elemento.appendChild(img);
      contenedor.appendChild(elemento);
    }

    // ==========================================
    // ARRANQUE (Bootstrap de la aplicación)
    // ==========================================
    cargarLoteDeFotos();
    observadorScroll.observe(centinela);
  </script>
</body>

</html>
