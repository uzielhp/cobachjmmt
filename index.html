<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBACH JMMT</title>
  <link rel="icon" type="image/png" href="imgs/favicon.png" />

  <link rel="stylesheet" href="bootstrap-icons.min.css">
  <link rel="stylesheet" href="bootstrap.min.css">
  <link rel="stylesheet" href="principal.css">

  <script src="principal.js"></script>
</head>

<body>  
  <h-cargando></h-cargando>
  <h-menu></h-menu>  

  <main>
    <noscript>
      <div class="text-center text-warning p-3">
        La galería requiere JavaScript. Activa JavaScript para ver las imágenes.
      </div>
    </noscript>
    <div class="masonry-grid" id="collage-container"></div>
  </main>  

  <footer></footer>

  <script>
    // CONFIGURACIÓN DE LA GALERÍA
    const config = {
      jsonUrl: 'galeria.json',
      limiteImagenes: 12 // Cantidad fija de imágenes aleatorias a mostrar
    };

    // ESTADO DE LA APLICACIÓN
    const appState = {
      imagenes: [],
      columnasDOM: [],
      indiceColumnaActual: 0
    };

    const contenedor = document.getElementById('collage-container');

    // 1. GENERACIÓN DINÁMICA DE COLUMNAS RESPONSIVAS
    function prepararColumnas() {
      contenedor.innerHTML = '';
      appState.columnasDOM = [];

      // Breakpoint de Bootstrap: >= 768px son 3 columnas, móvil son 2
      const numColumnas = window.innerWidth >= 768 ? 3 : 2;
      const fragmento = document.createDocumentFragment();

      for (let i = 0; i < numColumnas; i++) {
        const col = document.createElement('div');
        col.className = 'masonry-column';
        fragmento.appendChild(col);
        appState.columnasDOM.push(col);
      }
      contenedor.appendChild(fragmento);
    }

    // 2. SELECCIÓN ALEATORIA DE IMÁGENES
    function obtenerImagenesAleatorias(rutas, cantidad) {
      const copia = [...rutas];
      // Mezcla de Fisher-Yates para aleatorizar el arreglo
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia.slice(0, cantidad);
    }

    // 3. LAZY LOAD DE IMÁGENES (Ahorro de ancho de banda)
    const observadorVisual = new IntersectionObserver((entradas) => {
      entradas.forEach(entrada => {
        if (entrada.isIntersecting) {
          const elemento = entrada.target;
          const img = elemento.querySelector('img');

          if (img?.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');

            img.onload = () => {
              elemento.classList.remove('esqueleto');
              requestAnimationFrame(() => elemento.classList.add('mostrar'));
            };

            img.onerror = () => {
              elemento.remove();
            };
          }
          observadorVisual.unobserve(elemento);
        }
      });
    }, { rootMargin: '0px 0px 300px 0px' });

    // 4. INYECCIÓN DEL PLACEHOLDER EN EL DOM
    function inyectarPlaceholder(ruta) {
      const elemento = document.createElement('div');
      elemento.className = 'masonry-item esqueleto';

      const nombreArchivo = ruta.split('/').pop().replace('.jpg', '');
      const img = document.createElement('img');
      img.loading = "lazy";
      img.alt = `Fotografía escolar ${nombreArchivo}`;
      img.dataset.src = ruta;

      elemento.appendChild(img);

      // Balanceo de distribución cíclica en columnas
      appState.columnasDOM[appState.indiceColumnaActual].appendChild(elemento);
      appState.indiceColumnaActual = (appState.indiceColumnaActual + 1) % appState.columnasDOM.length;

      observadorVisual.observe(elemento);
    }

    // 5. ORQUESTRADOR DE INICIALIZACIÓN
    async function inicializarGaleria() {
      try {
        prepararColumnas();

        // Obtención de datos del manifiesto
        const respuesta = await fetch(config.jsonUrl);
        if (!respuesta.ok) throw new Error(`Error HTTP: ${respuesta.status}`);

        const datosRaw = await respuesta.json();
        
        // Selecciona aleatoriamente hasta 10 imágenes (o el total si el JSON tiene menos de 10)
        appState.imagenes = obtenerImagenesAleatorias(datosRaw, config.limiteImagenes);

        // Renderizar las imágenes seleccionadas
        appState.imagenes.forEach(ruta => {
          inyectarPlaceholder(ruta);
        });

      } 
      catch (e) {
        if (typeof msgError === 'function') {
          msgError("Error al inicializar galería");
        } else {
          console.error("Error al inicializar galería", e);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', inicializarGaleria);    
  </script>
  
  <script type="module" src="bootstrap.bundle.min.js"></script>
</body>

</html>
