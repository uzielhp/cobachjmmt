<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBACH JMMT</title>
  <link rel="icon" type="image/png" href="imgs/favicon.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="principal.css">
  <script src="principal.js"></script>

  <style>
    /* ==========================================
   NUEVO LAYOUT: FLEXBOX COLUMNS
   ========================================== */
    .masonry-grid {
      display: flex;
      /* Cambiamos a Flexbox */
      gap: 0.5rem;
      /* Espacio entre columnas */
      padding: 0.5rem;
      align-items: flex-start;
      /* Permite que cada columna tenga su propia altura */
    }

    /* Nodos contenedores inyectados por JS */
    .masonry-column {
      flex: 1;
      /* Todas las columnas miden igual */
      display: flex;
      flex-direction: column;
      /* Apila las fotos hacia abajo */
      gap: 0.5rem;
      /* Espacio vertical entre fotos */
    }

    /* ==========================================
   ELEMENTOS (Ajustado para el nuevo layout)
   ========================================== */
    .masonry-item {
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;

      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        box-shadow 0.3s ease;
    }

    .masonry-item.mostrar {
      opacity: 1;
      transform: translateY(0);
    }

    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Soporte temporal para mantener el scroll mientras la foto no se haya descargado */
    .masonry-item.esqueleto {
      min-height: 200px;
    }
  </style>
</head>

<body>
  <div id="app-cargando"></div>

  <div id="app-content">
    <header></header>
    <main>
      <!-- Aquí se inyectarán las fotos del collage -->
      <div class="masonry-grid" id="collage-container"></div>
    </main>
  </div>

  <footer></footer>

  <script>
    // CONFIGURACIÓN DE LA GALERÍA
    const config = {
      jsonUrl: 'galeria.json',
      loteInicial: 12,      // Primera carga
      loteSubsecuente: 6    // Cargas por scroll
    };

    // ESTADO DE LA APLICACIÓN (Encapsulado)
    const appState = {
      imagenes: [],
      indiceActual: 0,
      cargando: false,
      columnasDOM: [],
      indiceColumnaActual: 0
    };

    const contenedor = document.getElementById('collage-container');

    // 1. INICIALIZACIÓN Y BALANCEO DE COLUMNAS
    function prepararColumnas() {
      contenedor.innerHTML = '';
      appState.columnasDOM = [];

      // Responsive break: 3 columnas en MD (Bootstrap >= 768px), 2 en móviles
      const numColumnas = window.innerWidth >= 768 ? 3 : 2;

      const fragmento = document.createDocumentFragment();
      for (let i = 0; i < numColumnas; i++) {
        const col = document.createElement('div');
        col.className = 'masonry-column';
        fragmento.appendChild(col);
        appState.columnasDOM.push(col);
      }
      contenedor.appendChild(fragmento);
    }

    // 2. ORDENAMIENTO NATURAL (Evita que 1.10 vaya antes que 1.2)
    function ordenarRutasNatural(rutas) {
      const colator = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });
      return rutas.sort((a, b) => colator.compare(a, b));
    }

    // 3. OBSERVADOR ACCESIBLE Y PERFORMANCE (Lazy Load)
    const observadorVisual = new IntersectionObserver((entradas) => {
      entradas.forEach(entrada => {
        if (entrada.isIntersecting) {
          const elemento = entrada.target;
          const img = elemento.querySelector('img');

          if (img?.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');

            img.onload = () => {
              elemento.classList.remove('esqueleto');
              // requestAnimationFrame evita bloqueos en el hilo principal de renderizado
              requestAnimationFrame(() => elemento.classList.add('mostrar'));
            };

            img.onerror = () => {
              elemento.remove();
              balancearAlturas(); // Opcional: Reajuste defensivo si falla una imagen
            };
          }
          observadorVisual.unobserve(elemento);
        }
      });
    }, { rootMargin: '0px 0px 300px 0px' });

    // 4. INYECCIÓN CONTROLADA AL DOM
    function inyectarPlaceholder(ruta) {
      const elemento = document.createElement('div');
      elemento.className = 'masonry-item esqueleto';

      // Extracción limpia del nombre del archivo para accesibilidad (SEO / Screen Readers)
      const nombreArchivo = ruta.split('/').pop().replace('.jpg', '');

      const img = document.createElement('img');
      img.alt = `Fotografía escolar ${nombreArchivo}`;
      img.dataset.src = ruta;

      elemento.appendChild(img);

      // Inyección equilibrada en la columna correspondiente
      appState.columnasDOM[appState.indiceColumnaActual].appendChild(elemento);
      appState.indiceColumnaActual = (appState.indiceColumnaActual + 1) % appState.columnasDOM.length;

      observadorVisual.observe(elemento);
    }

    // 5. CONTROLADOR DE FLUJO MEJORADO (Retorna una promesa con las imágenes del lote)
    function cargarLoteDeFotos(tamanoLote) {
      if (appState.cargando || appState.indiceActual >= appState.imagenes.length) return Promise.resolve();
      appState.cargando = true;

      const limite = Math.min(appState.indiceActual + tamanoLote, appState.imagenes.length);
      const promesasImagenes = [];

      for (let i = appState.indiceActual; i < limite; i++) {
        const ruta = appState.imagenes[i];

        // Creamos el placeholder en el DOM
        inyectarPlaceholder(ruta);

        // Precarga defensiva en memoria para asegurar que el usuario no vea saltos de layout
        const promesaPreload = new Promise((resolve) => {
          const imgPreload = new Image();
          imgPreload.src = ruta;
          imgPreload.onload = () => resolve();
          imgPreload.onerror = () => resolve(); // No bloquea la UI si una imagen falla (404)
        });

        promesasImagenes.push(promesaPreload);
      }

      appState.indiceActual = limite;
      appState.cargando = false;

      // Devuelve una promesa única que se resuelve cuando todo el lote está descargado en caché
      return Promise.all(promesasImagenes);
    }

    // 6. CONFIGURACIÓN DEL CENTINELA (Scroll Infinito)
    const centinela = document.createElement('div');
    centinela.className = 'w-100';
    centinela.style.height = '1px';
    contenedor.parentNode.insertBefore(centinela, contenedor.nextSibling);

    const observadorScroll = new IntersectionObserver((entradas) => {
      if (entradas[0].isIntersecting && !appState.cargando && appState.indiceActual < appState.imagenes.length) {
        cargarLoteDeFotos(config.loteSubsecuente); // Las cargas subsecuentes no necesitan await global
      }
    }, { rootMargin: '0px 0px 400px 0px' });


    // ORQUESTRACIÓN ASÍNCRONA DE ARRANQUE (Sin interferir con principal.js)
    async function inicializarGaleria() {
      try {
        prepararColumnas();

        // 1. Descarga del manifiesto JSON
        const respuesta = await fetch(config.jsonUrl);
        if (!respuesta.ok) throw new Error(`Error HTTP: ${respuesta.status}`);

        const datosRaw = await respuesta.json();
        appState.imagenes = ordenarRutasNatural(datosRaw);

        // 2. Carga del lote inicial (Aparecerán con el efecto fade-in "mostrar" individual)
        cargarLoteDeFotos(config.loteInicial);

        // 3. Activamos el Infinite Scroll para el resto del scroll
        observadorScroll.observe(centinela);

      } catch (e) {
        msgError("Error al inicializar galería", e);
      }
    }

    // Inicialización segura tras el DOM
    document.addEventListener('DOMContentLoaded', inicializarGaleria);
  </script>
</body>

</html>
