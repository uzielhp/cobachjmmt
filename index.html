<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBACH JMMT</title>
  <link rel="icon" type="image/png" href="imgs/favicon.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="principal.css">
  <script src="principal.js"></script>

  <style>
    /* ==========================================
   NUEVO LAYOUT: FLEXBOX COLUMNS
   ========================================== */
    .masonry-grid {
      display: flex;
      /* Cambiamos a Flexbox */
      gap: 0.5rem;
      /* Espacio entre columnas */
      padding: 0.5rem;
      align-items: flex-start;
      /* Permite que cada columna tenga su propia altura */
    }

    /* Nodos contenedores inyectados por JS */
    .masonry-column {
      flex: 1;
      /* Todas las columnas miden igual */
      display: flex;
      flex-direction: column;
      /* Apila las fotos hacia abajo */
      gap: 0.5rem;
      /* Espacio vertical entre fotos */
    }

    /* ==========================================
   ELEMENTOS (Ajustado para el nuevo layout)
   ========================================== */
    .masonry-item {
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;

      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        box-shadow 0.3s ease;
      cursor: pointer;
    }

    .masonry-item.mostrar {
      opacity: 1;
      transform: translateY(0);
    }

    .masonry-item.mostrar:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
    }

    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Soporte temporal para mantener el scroll mientras la foto no se haya descargado */
    .masonry-item.esqueleto {
      min-height: 200px;
    }
  </style>
</head>

<body>
  <div id="app-cargando"></div>

  <div id="app-content" style="padding-top: 50px;">
    <header></header>
    <main>
      <!-- Aquí se inyectarán las fotos del collage -->
      <div class="masonry-grid" id="collage-container"></div>

      <!-- Pantalla completa (Modal de Bootstrap) para ver la foto -->
      <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
          <div class="modal-content">
            <div class="modal-header">
              <button type="button" class="btn-close btn-close-n" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <img id="fullImage" src="" alt="Fotografía en pantalla completa">
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer></footer>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE LA GALERÍA
    // ==========================================
    const config = {
      carpeta: 'imgs/galeria/',
      extensiones: ['jpg', 'jpeg', 'png', 'JPG', 'JPEG', 'PNG', 'webp'],
      maxFallosPermitidos: 10
    };

    const contenedor = document.getElementById('collage-container');
    const imagenEnGrande = document.getElementById('fullImage');
    const modalOpciones = new bootstrap.Modal(document.getElementById('imageModal'));

    let idFotoActual = 1;
    let finDeDirectorio = false;
    let contadorFallos = 0;
    let cargando = false;

    let columnasDOM = [];
    let indiceColumnaActual = 0;

    // ==========================================
    // 1. INICIALIZACIÓN DE COLUMNAS 
    // ==========================================
    function prepararColumnas() {
      contenedor.innerHTML = '';
      columnasDOM = [];
      const numColumnas = window.innerWidth >= 1200 ? 4 : (window.innerWidth >= 768 ? 3 : 2);

      for (let i = 0; i < numColumnas; i++) {
        const col = document.createElement('div');
        col.className = 'masonry-column';
        contenedor.appendChild(col);
        columnasDOM.push(col);
      }
    }

    // ==========================================
    // 2. OBSERVADOR: LAZY LOAD REAL Y ANIMACIÓN
    // ==========================================
    // Este observador SÓLO vigila lo visual. Se activa cuando haces scroll.
    const observadorVisual = new IntersectionObserver((entradas, observador) => {
      entradas.forEach(entrada => {
        if (entrada.isIntersecting) {
          const elemento = entrada.target;
          const img = elemento.querySelector('img');

          // Si la imagen tiene data-src, es hora de descargarla
          if (img.dataset.src) {
            img.src = img.dataset.src; // Inicia la descarga en red
            img.removeAttribute('data-src'); // Limpiamos el atributo

            // Cuando el navegador termine de descargar los píxeles reales...
            img.onload = () => {
              // 1. Quitamos la altura forzada para que se adapte y no deje HUECOS NEGROS
              elemento.classList.remove('esqueleto');
              // 2. Disparamos la animación suave de CSS
              requestAnimationFrame(() => elemento.classList.add('mostrar'));
            };

            // Failsafe: Si por alguna razón la red falla tras intentar cargarla
            img.onerror = () => elemento.remove();
          }

          // Dejamos de vigilar el nodo para ahorrar rendimiento de CPU
          observador.unobserve(elemento);
        }
      });
    }, {
      rootMargin: '0px 0px 150px 0px' // Empieza la descarga 150px antes de que asome en pantalla
    });

    // ==========================================
    // 3. VALIDACIÓN DE EXISTENCIA (Cero Descargas)
    // ==========================================
    async function verificarExistencia(id) {
      for (let ext of config.extensiones) {
        const ruta = `${config.carpeta}${id}.${ext}`;
        try {
          // Petición HEAD: Solo pide metadatos al servidor, no descarga la imagen real
          const respuesta = await fetch(ruta, { method: 'HEAD' });
          if (respuesta.ok) return { exito: true, ruta: ruta };
        } catch (error) {
          // Falla silenciosamente si hay error de red
        }
      }
      return { exito: false, ruta: null };
    }

    // ==========================================
    // 4. INYECCIÓN DEL "HUECO" AL DOM
    // ==========================================
    function inyectarPlaceholder(ruta, id) {
      const elemento = document.createElement('div');
      // Agregamos 'esqueleto' temporalmente para que tenga altura en la pantalla
      elemento.className = 'masonry-item esqueleto';
      elemento.tabIndex = 0;
      elemento.setAttribute('role', 'button');

      const img = document.createElement('img');
      img.alt = `Fotografía número ${id}`;
      // CRÍTICO: Usamos data-src. El navegador ignorará esta imagen por ahora.
      img.dataset.src = ruta;

      elemento.appendChild(img);
      columnasDOM[indiceColumnaActual].appendChild(elemento);
      indiceColumnaActual = (indiceColumnaActual + 1) % columnasDOM.length;

      // Mandamos el elemento invisible al observador para que espere tu scroll
      observadorVisual.observe(elemento);

      const abrirModal = () => {
        imagenEnGrande.src = ruta;
        modalOpciones.show();
      };

      elemento.addEventListener('click', abrirModal);
      elemento.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          abrirModal();
        }
      });
    }

    // ==========================================
    // 5. CONTROLADOR PRINCIPAL Y DATOS
    // ==========================================
    async function cargarLoteDeFotos() {
      if (cargando || finDeDirectorio) return;
      cargando = true;

      const alturaPantalla = window.innerHeight;
      const filasQueCaben = Math.ceil(alturaPantalla / 200);
      const fotosACargar = (filasQueCaben * columnasDOM.length) + columnasDOM.length;

      let fotosInyectadas = 0;

      while (fotosInyectadas < fotosACargar && !finDeDirectorio) {
        const resultado = await verificarExistencia(idFotoActual);

        if (resultado.exito) {
          contadorFallos = 0;
          inyectarPlaceholder(resultado.ruta, idFotoActual);
          fotosInyectadas++;
        } else {
          contadorFallos++;
          if (contadorFallos >= config.maxFallosPermitidos) {
            finDeDirectorio = true;
          }
        }

        idFotoActual++;
      }

      cargando = false;

      // Seguimos validando si hace falta rellenar más la pantalla inicial
      if (!finDeDirectorio && centinela.getBoundingClientRect().top < window.innerHeight) {
        cargarLoteDeFotos();
      }
    }

    // ==========================================
    // 6. OBSERVADOR DEL INFINITE SCROLL
    // ==========================================
    const observadorScroll = new IntersectionObserver((entradas) => {
      if (entradas[0].isIntersecting) {
        cargarLoteDeFotos();
      }
    }, { rootMargin: '0px 0px 500px 0px' });

    const centinela = document.createElement('div');
    centinela.style.width = '100%';
    centinela.style.height = '1px';
    contenedor.parentNode.insertBefore(centinela, contenedor.nextSibling);

    // ARRANQUE
    prepararColumnas();
    cargarLoteDeFotos();
    observadorScroll.observe(centinela);
  </script>
</body>

</html>
