<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBACH JMMT</title>
  <link rel="icon" type="image/png" href="imgs/favicon.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="principal.css">
  <script src="principal.js"></script>

  <style>
    /* ==========================================
   NUEVO LAYOUT: FLEXBOX COLUMNS
   ========================================== */
    .masonry-grid {
      display: flex;
      /* Cambiamos a Flexbox */
      gap: 0.5rem;
      /* Espacio entre columnas */
      padding: 0.5rem;
      align-items: flex-start;
      /* Permite que cada columna tenga su propia altura */
    }

    /* Nodos contenedores inyectados por JS */
    .masonry-column {
      flex: 1;
      /* Todas las columnas miden igual */
      display: flex;
      flex-direction: column;
      /* Apila las fotos hacia abajo */
      gap: 0.5rem;
      /* Espacio vertical entre fotos */
    }

    /* ==========================================
   ELEMENTOS (Ajustado para el nuevo layout)
   ========================================== */
    .masonry-item {
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;

      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        box-shadow 0.3s ease;
    }

    .masonry-item.mostrar {
      opacity: 1;
      transform: translateY(0);
    }

    .masonry-item.mostrar:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
    }

    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Soporte temporal para mantener el scroll mientras la foto no se haya descargado */
    .masonry-item.esqueleto {
      min-height: 200px;
    }
  </style>
</head>

<body>
  <div id="app-cargando"></div>

  <div id="app-content">
    <header></header>
    <main>
      <!-- Aquí se inyectarán las fotos del collage -->
      <div class="masonry-grid" id="collage-container"></div>
    </main>
  </div>

  <footer></footer>

  <script>
    // CONFIGURACIÓN DE LA GALERÍA
    const config = {
      carpeta: 'imgs/galeria/',
      extensiones: ['jpg'],
      maxGruposVacios: 3,
      loteInicial: 12, // Primera carga
      loteSubsecuente: 6 // Cargas por scroll
    };

    const contenedor = document.getElementById('collage-container');

    // Controladores de nomenclatura X.Y
    let grupoActual = 1;
    let subItemActual = 1;
    let finDeDirectorio = false;
    let contadorGruposVacios = 0;
    let cargando = false;

    let columnasDOM = [];
    let indiceColumnaActual = 0;

    // 1. INICIALIZACIÓN DE COLUMNAS 
    function prepararColumnas() {
      contenedor.innerHTML = '';
      columnasDOM = [];
      const numColumnas = window.innerWidth >= 768 ? 3 : 2;
      for (let i = 0; i < numColumnas; i++) {
        const col = document.createElement('div');
        col.className = 'masonry-column';
        contenedor.appendChild(col);
        columnasDOM.push(col);
      }
    }

    // 2. OBSERVADOR: LAZY LOAD Y AUTO-COMPENSACIÓN
    const observadorVisual = new IntersectionObserver((entradas) => {
      entradas.forEach(entrada => {
        if (entrada.isIntersecting) {
          const elemento = entrada.target;
          const img = elemento.querySelector('img');

          if (img && img.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');

            img.onload = () => {
              elemento.classList.remove('esqueleto');
              requestAnimationFrame(() => elemento.classList.add('mostrar'));
            };

            img.onerror = () => elemento.remove();
          }
          observadorVisual.unobserve(elemento);
        }
      });
    }, { rootMargin: '0px 0px 300px 0px' }); // Incrementado para suavizar transiciones

    // 3. VALIDACIÓN CONCURRENTE
    async function verificarExistencia(id) {
      const peticiones = config.extensiones.map(ext => {
        const ruta = `${config.carpeta}${id}.${ext}`;
        return fetch(ruta, { method: 'HEAD' }).then(respuesta => {
          if (respuesta.ok) return ruta;
          throw new Error('404');
        });
      });

      try {
        const rutaValida = await Promise.any(peticiones);
        return { exito: true, ruta: rutaValida };
      } catch {
        return { exito: false, ruta: null };
      }
    }

    // 4. INYECCIÓN AL DOM
    function inyectarPlaceholder(ruta, id) {
      const elemento = document.createElement('div');
      elemento.className = 'masonry-item esqueleto';

      const img = document.createElement('img');
      img.alt = `Fotografía ${id}`;
      img.dataset.src = ruta;

      elemento.appendChild(img);
      columnasDOM[indiceColumnaActual].appendChild(elemento);

      // Balanceo de columnas secuencial
      indiceColumnaActual = (indiceColumnaActual + 1) % columnasDOM.length;

      observadorVisual.observe(elemento);
    }

    // 5. CONTROLADOR DE LÓGICA DE CARGA (Corregido y optimizado para flujo X.Y)
    async function cargarLoteDeFotos(tamanoLote) {
      if (cargando || finDeDirectorio) return;
      cargando = true;

      let fotosInyectadas = 0;

      while (fotosInyectadas < tamanoLote && !finDeDirectorio) {
        const idFormateado = `${grupoActual}.${subItemActual}`;
        const resultado = await verificarExistencia(idFormateado);

        if (resultado.exito) {
          // Encontró la foto (Ej: 1.1)
          contadorGruposVacios = 0;
          inyectarPlaceholder(resultado.ruta, idFormateado);
          fotosInyectadas++;
          subItemActual++; // Avanza al siguiente subítem (Ej: 1.2)
        } else {
          // No encontró la foto (Ej: 1.4 no existe)
          if (subItemActual === 1) {
            // Si falló en el .1, el grupo entero está vacío
            contadorGruposVacios++;
            if (contadorGruposVacios >= config.maxGruposVacios) {
              finDeDirectorio = true;
              break; // Rompe el bucle de inmediato si ya no hay más carpetas
            }
            // Si falló el .1 pero no hemos llegado al límite, saltamos al siguiente grupo
            grupoActual++;
          } else {
            // Si falló en el .4, significa que terminaron las fotos del grupo actual (grupo 1).
            // Saltamos al siguiente grupo (grupo 2) y empezamos estricta y limpiamente desde el .1
            grupoActual++;
            subItemActual = 1;
            contadorGruposVacios = 0; // Reseteamos porque este grupo sí tuvo fotos
          }
        }
      }

      cargando = false;
    }

    // 6. OBSERVADOR DEL INFINITE SCROLL
    const centinela = document.createElement('div');
    centinela.className = 'w-100'; // Utiliza clase Bootstrap útil
    centinela.style.height = '1px';
    contenedor.parentNode.insertBefore(centinela, contenedor.nextSibling);

    const observadorScroll = new IntersectionObserver((entradas) => {
      // Solo dispara si el centinela intersecta Y la carga inicial ya finalizó
      if (entradas[0].isIntersecting && !cargando && !finDeDirectorio) {
        cargarLoteDeFotos(config.loteSubsecuente);
      }
    }, { rootMargin: '0px 0px 400px 0px' }); // Margen proactivo para precargar antes de llegar al fondo

    // ORQUESTRACIÓN DE ARRANQUE (IIFE Asíncrona)
    (async () => {
      prepararColumnas();
      // Forzamos la carga exacta de las primeras 12
      await cargarLoteDeFotos(config.loteInicial);
      // Una vez renderizadas las 12 iniciales, activamos el scroll infinito
      observadorScroll.observe(centinela);
    })();
  </script>
</body>

</html>
