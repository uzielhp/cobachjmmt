<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBACH JMMT</title>
  <link rel="icon" type="image/png" href="imgs/favicon.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="principal.css">
  <script src="principal.js"></script>

  <style>
    /* ==========================================
   NUEVO LAYOUT: FLEXBOX COLUMNS
   ========================================== */
    .masonry-grid {
      display: flex;
      /* Cambiamos a Flexbox */
      gap: 0.5rem;
      /* Espacio entre columnas */
      padding: 0.5rem;
      align-items: flex-start;
      /* Permite que cada columna tenga su propia altura */
    }

    /* Nodos contenedores inyectados por JS */
    .masonry-column {
      flex: 1;
      /* Todas las columnas miden igual */
      display: flex;
      flex-direction: column;
      /* Apila las fotos hacia abajo */
      gap: 0.5rem;
      /* Espacio vertical entre fotos */
    }

    /* ==========================================
   ELEMENTOS (Ajustado para el nuevo layout)
   ========================================== */
    .masonry-item {
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;

      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        box-shadow 0.3s ease;
    }

    .masonry-item.mostrar {
      opacity: 1;
      transform: translateY(0);
    }

    .masonry-item.mostrar:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
    }

    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Soporte temporal para mantener el scroll mientras la foto no se haya descargado */
    .masonry-item.esqueleto {
      min-height: 200px;
    }
  </style>
</head>

<body>
  <div id="app-cargando"></div>

  <div id="app-content">
    <header></header>
    <main>
      <!-- Aquí se inyectarán las fotos del collage -->
      <div class="masonry-grid" id="collage-container"></div>
    </main>
  </div>

  <footer></footer>

  <script>
    // CONFIGURACIÓN DE LA GALERÍA
    const config = {
      carpeta: 'imgs/galeria/',
      // Minimizadas para evitar sobrecarga de red. Agrega más si el servidor es Case-Sensitive.
      extensiones: ['jpg', 'jpeg', 'png', 'webp', 'JPG'],
      maxGruposVacios: 3 // Cantidad de grupos (ej. 3.x, 4.x, 5.x) que pueden fallar seguidos antes de detener el scroll
    };

    const contenedor = document.getElementById('collage-container');

    // Controladores de nomenclatura X.Y
    let grupoActual = 1;
    let subItemActual = 1;
    let finDeDirectorio = false;
    let contadorGruposVacios = 0;
    let cargando = false;

    let columnasDOM = [];
    let indiceColumnaActual = 0;

    // 1. INICIALIZACIÓN DE COLUMNAS 
    function prepararColumnas() {
      contenedor.innerHTML = '';
      columnasDOM = [];
      const numColumnas = window.innerWidth >= 768 ? 3 : 2;
      for (let i = 0; i < numColumnas; i++) {
        const col = document.createElement('div');
        col.className = 'masonry-column';
        contenedor.appendChild(col);
        columnasDOM.push(col);
      }
    }

    // 2. OBSERVADOR: LAZY LOAD Y AUTO-COMPENSACIÓN
    const observadorVisual = new IntersectionObserver((entradas, observador) => {
      entradas.forEach(entrada => {
        if (entrada.isIntersecting) {
          const elemento = entrada.target;
          const img = elemento.querySelector('img');

          if (img.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');

            img.onload = () => {
              elemento.classList.remove('esqueleto');
              requestAnimationFrame(() => elemento.classList.add('mostrar'));

              setTimeout(() => {
                if (!cargando && !finDeDirectorio) {
                  const centinelaVisible = centinela.getBoundingClientRect().top < window.innerHeight + 200;
                  if (centinelaVisible) cargarLoteDeFotos();
                }
              }, 50);
            };

            img.onerror = () => elemento.remove();
          }

          observador.unobserve(elemento);
        }
      });
    }, { rootMargin: '0px 0px 200px 0px' });

    // 3. VALIDACIÓN CONCURRENTE (Optimización de red)
    async function verificarExistencia(id) {
      // Disparamos peticiones HEAD para todas las extensiones al mismo tiempo
      const peticiones = config.extensiones.map(ext => {
        const ruta = `${config.carpeta}${id}.${ext}`;
        return fetch(ruta, { method: 'HEAD' }).then(respuesta => {
          if (respuesta.ok) return ruta;
          throw new Error('Archivo no encontrado');
        });
      });

      try {
        // Promise.any resuelve con la primera petición exitosa (la extensión correcta)
        const rutaValida = await Promise.any(peticiones);
        return { exito: true, ruta: rutaValida };
      } catch (error) {
        // Todas las promesas fallaron (ninguna extensión existe)
        return { exito: false, ruta: null };
      }
    }

    // 4. INYECCIÓN AL DOM
    function inyectarPlaceholder(ruta, id) {
      const elemento = document.createElement('div');
      elemento.className = 'masonry-item esqueleto';

      const img = document.createElement('img');
      img.alt = `Fotografía ${id}`; // Ejemplo: Fotografía 1.2
      img.dataset.src = ruta;

      elemento.appendChild(img);
      columnasDOM[indiceColumnaActual].appendChild(elemento);
      indiceColumnaActual = (indiceColumnaActual + 1) % columnasDOM.length;

      observadorVisual.observe(elemento);
    }

    // 5. CONTROLADOR DE LÓGICA DE CARGA (Nomenclatura X.Y)
    async function cargarLoteDeFotos() {
      if (cargando || finDeDirectorio) return;
      cargando = true;

      const alturaPantalla = window.innerHeight;
      const filasQueCaben = Math.ceil(alturaPantalla / 200);
      const fotosACargar = Math.max((filasQueCaben * columnasDOM.length) + columnasDOM.length, 6);

      let fotosInyectadas = 0;

      while (fotosInyectadas < fotosACargar && !finDeDirectorio) {
        // Formateamos el ID dinámico ej: "1.1", "1.2", "2.1"
        const idFormateado = `${grupoActual}.${subItemActual}`;
        const resultado = await verificarExistencia(idFormateado);

        if (resultado.exito) {
          // Encontramos la imagen. Reseteamos fallos de grupo y preparamos la siguiente foto.
          contadorGruposVacios = 0;
          inyectarPlaceholder(resultado.ruta, idFormateado);
          fotosInyectadas++;
          subItemActual++; // Probamos la siguiente del mismo grupo (ej. de 1.1 pasamos a 1.2)
        } else {
          // No se encontró la imagen.
          if (subItemActual === 1) {
            // Si falló en la .1, significa que el grupo entero no existe.
            contadorGruposVacios++;
            if (contadorGruposVacios >= config.maxGruposVacios) {
              finDeDirectorio = true; // Demasiados grupos vacíos, detenemos el infinite scroll
            }
          }
          // Sin importar si fue la .1 o la .5, al fallar avanzamos al siguiente grupo
          grupoActual++;
          subItemActual = 1; // Reiniciamos el subítem a 1 para el nuevo grupo
        }
      }

      cargando = false;

      if (!finDeDirectorio && centinela.getBoundingClientRect().top < window.innerHeight + 200) {
        cargarLoteDeFotos();
      }
    }

    // 6. OBSERVADOR DEL INFINITE SCROLL
    const observadorScroll = new IntersectionObserver((entradas) => {
      if (entradas[0].isIntersecting) {
        cargarLoteDeFotos();
      }
    }, { rootMargin: '0px 0px 200px 0px' });

    const centinela = document.createElement('div');
    centinela.style.width = '100%';
    centinela.style.height = '1px';
    contenedor.parentNode.insertBefore(centinela, contenedor.nextSibling);

    // ARRANQUE
    prepararColumnas();
    cargarLoteDeFotos();
    observadorScroll.observe(centinela);
  </script>
</body>

</html>
